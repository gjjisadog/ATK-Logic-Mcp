# DK9 HIL Test Specification
# Target Scenario: Hybrid30K + TMS320F28P65 + DK9 OpenLoop PWM + ATK-DL16

test_suite: "DK9 OpenLoop PWM Verification"
version: "1.1.0"

device:
  expected_model: "DL16"
  min_hardware_version: 1

capture:
  channels: [0, 1, 2, 3, 4, 5]
  channel_map:
    0: "EPWM1A (Phase U High)"
    1: "EPWM1B (Phase U Low)"
    2: "EPWM2A (Phase V High)"
    3: "EPWM2B (Phase V Low)"
    4: "EPWM3A (Phase W High)"
    5: "EPWM3B (Phase W Low)"
  sample_rate_hz: 100000000 # 100 MHz (10 ns resolution)
  duration_ms: 40            # 40 ms (covers 2 full 50 Hz fundamental modulation cycles)
  threshold_voltage: 1.65    # 3.3V LVCMOS midpoint
  trigger: "immediate"
  mode: "buffer"

assertions:
  pwm_carrier:
    target_hz: 16000.0       # 16 kHz TI F28P65 nominal ePWM carrier
    tolerance_hz: 100.0      # +/- 100 Hz
    max_jitter_rms_ns: 200.0 # ePWM carrier jitter limit under dynamic modulation
    max_carrier_freq_diff_hz: 50.0 # Carrier frequency consistency across phases

  duty_cycle:
    # OpenLoop Sinusoidal PWM: Duty is dynamic, not a fixed 50%
    mode: "dynamic_sine_modulation"
    min_allowed_duty: 0.05   # Never stuck at 0%
    max_allowed_duty: 0.95   # Never stuck at 100%

  deadtime:
    target_ns: 1000.0        # 1.0 us nominal deadband (TBD pending firmware DBRED/DBFED confirmation)
    min_allowed_ns: 800.0    # Hard minimum to prevent shoot-through
    max_allowed_ns: 1200.0   # Hard maximum

  shoot_through_protection:
    allow_overlap: false     # Zero overlap allowed between complementary pairs
    max_overlap_samples: 0

  three_phase_modulation:
    fundamental_frequency_hz: 50.0 # 50 Hz inverter output
    fundamental_tolerance_hz: 2.0  # +/- 2.0 Hz tolerance
    phase_shift_target_deg: 120.0  # 120-degree sinusoidal displacement
    phase_shift_tolerance_deg: 15.0
    require_modulation_balance: true
