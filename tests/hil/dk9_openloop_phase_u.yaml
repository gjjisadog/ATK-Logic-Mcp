# DK9 Single-Phase (Phase U) HIL Test Specification
# Target Scenario: Hybrid30K + TMS320F28P65 + DK9 OpenLoop PWM + ATK-DL16 (CH0 -> GPIO0)

test_suite: "DK9 OpenLoop Phase U PWM Verification"
version: "1.1.0"

device:
  expected_model: "DL16"
  min_hardware_version: 1

capture:
  channels: [0]
  channel_map:
    0: "EPWM1A Phase U High GPIO0"
  sample_rate_hz: 100000000 # 100 MHz (10 ns resolution)
  duration_ms: 40            # 40 ms (covers 2 full 50 Hz fundamental modulation cycles)
  threshold_voltage: 1.65    # 3.3V LVCMOS midpoint
  trigger: "immediate"
  mode: "buffer"

assertions:
  pwm_carrier:
    target_hz: 16000.0       # 16 kHz TI F28P65 nominal ePWM carrier
    tolerance_hz: 100.0      # +/- 100 Hz
    max_output_edge_period_variation_rms_ns: 200.0 # Output-edge period variation limit under dynamic modulation

  duty_cycle:
    # OpenLoop Sinusoidal PWM: Duty is dynamic, not a fixed 50%
    mode: "dynamic_sine_modulation"
    min_allowed_duty: 0.0005 # In 10V / 400V modulation, min duty is ~0.08%
    max_allowed_duty: 0.95   # Peak observed ~6.1%
